[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "password-auditor"
version = "0.1.0"
description = "Auditor de qualidade de senhas: entropia, tempo de quebra, dicionário e reuso."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diogo Damasceno", email = "mitszukyo@gmail.com" }]
keywords = ["security", "password", "entropy", "audit", "cybersecurity"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pwaudit = "password_auditor.cli:main"

[tool.setuptools.packages.find]
include = ["password_auditor*"]
